# render.yaml
services:
  - type: web
    name: hostay-chatbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false  
      - key: JWT_SECRET
        sync: false