<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Chatbot Login</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial;

    background: linear-gradient(135deg, #4f7cff, #6a5acd);
}

/* Glass Card */
.card {
    width: 360px;
    padding: 35px;
    border-radius: 20px;

    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(18px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);

    color: white;
    text-align: center;
}

/* Title */
.card h2 {
    margin-bottom: 25px;
    font-size: 24px;
}

/* Inputs */
input {
    width: 100%;
    padding: 12px;
    margin: 10px 0;

    border: none;
    border-radius: 12px;
    outline: none;
}

/* Button */
button {
    width: 100%;
    padding: 12px;

    background: #5b6cff;
    color: white;
    border: none;
    border-radius: 12px;

    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: #3f52ff;
    transform: scale(1.03);
}

/* Footer */
.small {
    margin-top: 12px;
    font-size: 12px;
    opacity: 0.7;
}
</style>

</head>

<body>

<div class="card">
    <h2>🔐 Admin Chatbot Panel</h2>

    <form method="post" action="/admin/login">
        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>

        <button type="submit">Login</button>

    {% if error %}
    <div style="
        margin-top: 15px;
        color: #ff4d4d;
        background: rgba(255,0,0,0.1);
        padding: 10px;
        border-radius: 10px;
        font-weight: bold;
    ">
        {{ error }}
    </div>
    {% endif %}
    </form>

    <div class="small">
        Hostay Admin Chatbot System
    </div>
</div>

</body>
</html>
