name: Cleanup Legacy Chatbot Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: khalid-chatbot-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-cleanup:
    runs-on: ubuntu-latest
    env:
      VPS_APP_PATH: ${{ secrets.VPS_APP_PATH }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Basic sanity check
        run: python -m compileall .

      - name: Cleanup legacy VPS deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_PATH
          script: |
            set -e
            APP_DIR="${VPS_APP_PATH:-$HOME/apps/khalid-chatbot}"
            PID_FILE="$APP_DIR/.uvicorn.pid"
            mkdir -p "$APP_DIR"
            if [ -f "$PID_FILE" ] && kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "Stopping legacy uvicorn process..."
              kill "$(cat "$PID_FILE")" || true
              sleep 2
            fi

            if [ -f "$PID_FILE" ] && kill -0 "$(cat "$PID_FILE")" 2>/dev/null; then
              echo "Force stopping legacy uvicorn process..."
              kill -9 "$(cat "$PID_FILE")" || true
            fi
            rm -f "$PID_FILE"

            if [ -d "$APP_DIR/.venv" ]; then
              echo "Removing legacy virtualenv at $APP_DIR/.venv"
              rm -rf "$APP_DIR/.venv"
            else
              echo "No legacy virtualenv found at $APP_DIR/.venv"
            fi

            echo "Cleanup completed. Persistent files like SQLite DB and logs were left untouched."
