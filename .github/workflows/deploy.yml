name: Deploy Hostay Chatbot

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: khalid-chatbot-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quick sanity check — no torch, completes in ~2 min ──
  quality-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install app deps (no ML)
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q .

  # ── Deploy: ship source to VPS, build Docker there ──
  # The VPS keeps its own Docker layer cache, so the torch/ML layer is only
  # downloaded once (first deploy). Every subsequent deploy only rebuilds the
  # fast app layer (~30-60 s). No 2 GB tar is ever transferred over the wire.
  build-deploy:
    runs-on: ubuntu-latest
    needs: quality-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      VPS_APP_PORT: ${{ secrets.VPS_APP_PORT }}
    steps:
      - uses: actions/checkout@v4

      - name: Package source (git-tracked files only, ~50 KB)
        run: |
          git archive --format=tar.gz HEAD -o /tmp/app.tar.gz
          echo "Package size: $(du -sh /tmp/app.tar.gz | cut -f1)"

      - name: Write .env
        run: |
          if [ -z "${{ secrets.ENV_FILE }}" ]; then
            echo "ENV_FILE secret is missing." && exit 1
          fi
          printf '%s\n' "${{ secrets.ENV_FILE }}" > /tmp/chatbot.env
          echo "CHATBOT_DB_PATH=/app/data/hostay_chatbot.db" >> /tmp/chatbot.env
          echo "HF_HOME=/app/.cache/huggingface" >> /tmp/chatbot.env

      - name: Copy source + env to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: "/tmp/app.tar.gz,/tmp/chatbot.env"
          target: "/tmp/"
          overwrite: true

      - name: Build and deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: VPS_APP_PORT
          script: |
            set -e

            PORT="${VPS_APP_PORT:-8055}"
            CONTAINER_NAME="hostay-chatbot"
            BUILD_DIR="$HOME/builds/hostay-chatbot"

            echo "→ Extracting source..."
            mkdir -p "$BUILD_DIR"
            tar -xzf /tmp/app.tar.gz -C "$BUILD_DIR" --overwrite

            echo "→ Building Docker image (VPS layer cache active)..."
            cd "$BUILD_DIR"
            docker build -t "${CONTAINER_NAME}:latest" .

            echo "→ Replacing container..."
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm   "$CONTAINER_NAME" 2>/dev/null || true

            docker volume create hostay_chatbot_data    >/dev/null
            docker volume create hostay_chatbot_hf_cache >/dev/null

            NETWORK_ARGS=""
            docker network inspect automation_default >/dev/null 2>&1 && \
              NETWORK_ARGS="--network automation_default"

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --env-file /tmp/chatbot.env \
              -p "${PORT}:8055" \
              -v hostay_chatbot_data:/app/data \
              -v hostay_chatbot_hf_cache:/app/.cache/huggingface \
              $NETWORK_ARGS \
              "${CONTAINER_NAME}:latest"

            echo "→ Waiting for container to stabilise..."
            sleep 12

            if ! docker ps --format '{{.Names}}' | grep -q "^${CONTAINER_NAME}$"; then
              echo "✗ Container failed to start. Logs:"
              docker logs "$CONTAINER_NAME" || true
              exit 1
            fi

            rm -f /tmp/app.tar.gz /tmp/chatbot.env
            docker image prune -f

            echo "✓ Deployed on port ${PORT}"
